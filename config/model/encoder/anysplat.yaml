defaults:
  - backbone: croco

name: anysplat
mode: ${mode}

# Reconstruction features/cameras: zipmap, streamvggt, or abot, with shared GS heads.
reconstruction_backbone: zipmap
# native: use the selected backbone's pretrained DPT depth head.
# world_mirror: use the depth output inside the WorldMirror GS feature head.
depth_head_source: native
streamvggt_weights_path: weights/pre_svggt.safetensors
abot_weights_path: null
# Released ABot-Recon uses a fixed 12-frame local window. SDPA is portable and
# does not require the optional FlashInfer runtime.
abot_local_window_frames: 12
abot_attention_backend: sdpa  # auto | sdpa | paged
abot_amp_dtype: bf16          # fp32 | fp16 | bf16
abot_max_frames: 4096
depth_teacher: ${oc.select:loss.depth.teacher,dav3}
# Experiments with direct pose/FOV supervision can detach rasterizer geometry
# from the camera head when camera gradients are unstable.
detach_predicted_camera_for_geometry: false
# Share the first input frame's predicted intrinsics across the sequence.
share_first_frame_intrinsics: false
# Optional oracle-camera ablation matching offline_gs_mlp_overfit.
sim3_alignment_mode: never  # auto | always | never
# Camera/intrinsics used to unproject source depth and build the streaming map.
geometry_camera_source: predicted  # gt | predicted
source_render_camera: predicted  # gt | predicted
heldout_test_camera: predicted  # gt | predicted
# Optional phase overrides. Null preserves the legacy fields above.
training_sim3_alignment_mode: null
training_geometry_camera_source: null
training_source_render_camera: null
training_heldout_test_camera: null
evaluation_sim3_alignment_mode: null
evaluation_geometry_camera_source: null
evaluation_source_render_camera: null
evaluation_heldout_test_camera: null

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

# legacy uses exp(raw_scale) with a fixed 0.1 world-space cap.
# pixel_footprint learns a bounded projected radius and converts it to world
# scale with depth / focal_px, making the parameterization Sim(3)-equivariant.
dense_scale_mode: legacy  # legacy | pixel_footprint
dense_scale_min_projected_radius: 0.5
dense_scale_max_projected_radius: 2.0

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 32

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

pretrained_weights: ""
scale_align: false

voxel_size: 0.001
n_offsets: 2
anchor_feat_dim: 83 # 32
add_view: false
color_attr: 3D # 3D or RGB
mlp_type: unified
scaffold: true
gir_top1_confidence_mode: none
gir_top1_confidence_floor: 0.25
gir_old_residual_enabled: true
gir_old_update_mode: pixel_topk
gir_projected_hidden_dim: 128
gir_projected_chunk_size: 65536
gir_projected_min_radius: 0.1
gir_projected_covariance_sigma: 3.0
gir_projected_opacity_logit_scale: 1.0
gir_projected_front_decay_strength: 0.02
gir_projected_warmup_steps: 1000
# RetroSplat-style d(RGB error)/d(opacity logit) evidence. Old and new GS use
# separate switches while sharing the evidence scaling and adapter weights.
gir_old_opacity_gradient_enabled: false
gir_new_opacity_gradient_enabled: false
gir_opacity_gradient_replay_views: 6
gir_opacity_gradient_scale: 1000.0
gir_opacity_gradient_clip: 20.0
gir_opacity_gradient_threshold: 1.0e-3
gir_opacity_gradient_current_weight: 1.0
gir_opacity_gradient_replay_weight: 0.5
# When enabled, deterministic front-conflict decay is allowed only where the
# combined current/replay RGB gradient asks opacity to decrease.
gir_opacity_gradient_front_decay_gate_enabled: false
gir_opacity_gradient_front_decay_threshold: 0.0
# Camera-space d(RGB loss)/d(mean residual) evidence for projected old GS.
gir_mean_gradient_enabled: false
gir_mean_gradient_scale: 1.0
gir_mean_gradient_clip: 20.0
gir_mean_gradient_threshold: 1.0e-6
gir_mean_gradient_replay_views: 6
gir_old_mean_gradient_current_weight: 1.0
gir_old_mean_gradient_replay_weight: 0.5
# Deterministic old-GS densification. The experiment must also enable old
# mean-gradient evidence because its norm is used as the split score.
gir_split_enabled: false
gir_split_projected_radius_threshold: 4.0
gir_split_mean_gradient_threshold: 1.0e-6
gir_split_min_observations: 2
gir_split_max_ratio: 0.005
gir_split_max_generation: 1
gir_split_offset_scale: 0.4
gir_split_scale_divisor: 1.6
gir_split_min_opacity: 0.02
# Zero disables the absolute map-size cap.
gir_split_max_gaussians: 0
gir_split_warmup_steps: 1000
# One scene-local first-order SGD step after the learned projected update.
gir_functional_update_enabled: false
gir_functional_update_replay_views: 2
gir_functional_update_top_ratio: 0.05
gir_functional_update_min_observations: 1
gir_functional_update_mean_enabled: true
gir_functional_update_opacity_enabled: true
gir_functional_update_harmonics_enabled: true
gir_functional_update_mean_learning_rate: 1.0e-3
gir_functional_update_opacity_learning_rate: 5.0e-3
gir_functional_update_harmonics_learning_rate: 1.0e-3
gir_functional_update_harmonics_gradient_scale: 1.0
gir_functional_update_harmonics_gradient_clip: 20.0
gir_functional_update_harmonics_gradient_threshold: 1.0e-6
gir_functional_update_current_weight: 1.0
gir_functional_update_replay_weight: 0.5
gir_functional_update_max_mean_step_scale: 0.25
gir_functional_update_max_opacity_logit_step: 0.10
gir_functional_update_max_harmonics_step: 0.05
# Append old/new GS first, then condition one shared pointwise residual on
# permutation-invariant gradients from every causally observed view.
gir_symmetric_multiview_update_enabled: false
gir_symmetric_multiview_hidden_dim: 128
gir_symmetric_multiview_chunk_size: 65536
# DeltaSplat-style RGB residual/render/depth/Plucker evidence. Experiments opt in.
gir_symmetric_multiview_visual_enabled: false
gir_symmetric_multiview_visual_feature_dim: 24
gir_symmetric_multiview_visual_hidden_dim: 32
gir_symmetric_multiview_visual_image_scale: 0.5
gir_symmetric_multiview_visual_depth_temperature: 0.10
gir_symmetric_multiview_visual_min_alpha: 0.01
gir_symmetric_multiview_opacity_gradient_scale: 1000.0
gir_symmetric_multiview_opacity_gradient_clip: 20.0
gir_symmetric_multiview_opacity_gradient_threshold: 1.0e-3
gir_symmetric_multiview_mean_gradient_scale: 1.0
gir_symmetric_multiview_mean_gradient_clip: 20.0
gir_symmetric_multiview_mean_gradient_threshold: 1.0e-6
gir_symmetric_multiview_harmonics_gradient_scale: 1.0
gir_symmetric_multiview_harmonics_gradient_clip: 20.0
gir_symmetric_multiview_harmonics_gradient_threshold: 1.0e-6
gir_symmetric_multiview_max_mean_step_scale: 0.10
gir_symmetric_multiview_max_rotation_step: 0.01
gir_symmetric_multiview_max_log_scale_step: 0.02
gir_symmetric_multiview_max_opacity_logit_step: 0.10
gir_symmetric_multiview_max_harmonics_step: 0.05
gir_symmetric_multiview_unbounded_updates: false
gir_training_mode: streaming_aux  # streaming_aux | incremental_final_map
# Progressive, non-recursive children for point-map anchors. Experiments opt in.
gir_anchor_child_enabled: false
gir_anchor_child_max_count: 8
gir_anchor_child_add_count: 1
gir_anchor_child_min_observations: 2
gir_anchor_child_gradient_threshold: 0.05
gir_anchor_child_coherence_threshold: 0.5
gir_anchor_child_max_conflict_ratio: 0.25
gir_anchor_child_cooldown_views: 2
gir_anchor_child_max_ratio: 0.05
gir_anchor_child_offset_scale: 0.4
gir_anchor_child_scale_divisor: 1.6
gir_anchor_child_min_opacity: 0.02
gir_anchor_child_max_gaussians: 500000
# Use the same camera-space evidence with an independent new-GS adapter.
gir_new_mean_gradient_enabled: false
gir_new_mean_gradient_replay_views: 0
gir_new_mean_gradient_current_weight: 1.0
gir_new_mean_gradient_replay_weight: 0.0
gir_old_delete_enabled: false
gir_old_delete_warmup_steps: 1000
gir_old_delete_target_ratio: 0.01
gir_old_delete_budget_weight: 0.01
gir_old_delete_threshold: 0.5
gir_old_delete_temperature: 1.0
gir_old_delete_min_observations: 2
gir_old_delete_test_prune_enabled: true
gir_old_decay_enabled: false
gir_old_decay_topk: 4
gir_old_decay_strength: 0.02
gir_old_decay_prune_threshold: 0.005
gir_residual_topk: 4
gir_residual_independent_heads: true
# Absolute means use raw camera-space output and ignore gir_mean_relative_scale;
# relative_depth uses tanh(output) * gir_mean_relative_scale * depth.
gir_mean_update_mode: absolute
gir_raw_scale_residual: true
gir_raw_opacity_residual: true
gir_raw_rotation_residual: false
gir_raw_harmonics_residual: false
gir_mean_relative_scale: 0.02
gir_rotation_scale: 0.05
gir_harmonics_scale: 0.10
# New-GS append policy. Hybrid point-map mode compares all projected point-map
# depth layers and deterministically fades conflicting front GS.
gir_append_mode: all  # all | point_map | tracker | tracker_point_map | learned
# Rolling previous-frame dense-tracker coverage. In tracker mode, no global-map
# projection or depth consistency is used to decide which pixels append.
gir_tracker_backend: spot  # spot | alltracker
gir_tracker_repo_path: third_party/SPOT
gir_tracker_weights_path: third_party/SPOT/ckpts/spot.pth
gir_tracker_mixed_precision: true
gir_tracker_iterations: 4
gir_tracker_window_length: 16
gir_tracker_visibility_threshold: 0.8
gir_tracker_coverage_threshold: 0.05
gir_tracker_dilation_radius: 1
gir_tracker_forward_backward_enabled: false
# A source track is accepted when cycle error is below
# absolute_threshold + relative_threshold * bidirectional motion magnitude.
gir_tracker_cycle_absolute_threshold: 1.5
gir_tracker_cycle_relative_threshold: 0.05
# Legacy fallback used only when hybrid mode is disabled.
gir_point_append_depth_check_enabled: true
# Align appended GS means/scales to the historical map's depth scale.
gir_point_append_align_depth_scale_enabled: false
# Use residual-updated GS means for subsequent point-map append coverage.
gir_point_map_follow_mean_updates_enabled: false
gir_point_append_hybrid_enabled: false
# Whether a current surface clearly in front of all projected history may append.
gir_point_append_current_in_front_enabled: true
# Whether a current surface behind unmatched projected history may append.
gir_point_append_history_in_front_enabled: true
gir_point_append_depth_relative_tolerance: 0.15
gir_point_append_rgb_bad_threshold: 0.08
gir_point_append_old_alpha_threshold: 0.10
# Set above zero only after checking the backbone confidence distribution.
gir_point_append_min_depth_confidence: 0.0
gir_point_append_front_conflict_confirm_views: 1
gir_point_append_front_conflict_opacity_decay: 0.30
gir_point_append_max_ratio: 1.0
gir_point_append_dilation_radius: 2
gir_point_append_chunk_size: 65536
gir_add_gate_enabled: false
gir_add_gate_warmup_steps: 1000
gir_add_rate_loss_weight: 0.0
gir_base_loss_weight: 1.0
gir_current_loss_weight: 1.0
gir_new_hole_loss_weight: 1.0
gir_replay_loss_weight: 0.5
gir_aux_loss_weight: 1.0
gir_debug_numerics: false
gir_debug_numerics_max_views: 2
gir_historical_detach_mode: means
gir_new_residual_enabled: false
# Replace dense gs_head parameters with analytic anchors, then decode all
# first-frame and append-selected later anchors with the shared new-GS MLP.
gir_new_gs_shared_decoder_enabled: false
gir_new_gs_shared_decoder_base_opacity: 0.5
gir_new_gs_shared_decoder_scale_multiplier: 1.0
gir_residual_alpha_threshold: 0.02
gir_residual_depth_relative_tolerance: 0.08
gir_residual_rgb_bad_threshold: 0.08
