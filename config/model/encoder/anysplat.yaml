defaults:
  - backbone: croco

name: anysplat
mode: ${mode}

# The encoder uses ZipMap features/cameras with the shared DPT and GS heads.
reconstruction_backbone: zipmap
depth_teacher: ${oc.select:loss.depth.teacher,dav3}

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 32

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

pretrained_weights: ""
scale_align: false

voxel_size: 0.001
n_offsets: 2
anchor_feat_dim: 83 # 32
add_view: false
color_attr: 3D # 3D or RGB
mlp_type: unified
scaffold: true
gir_top1_confidence_mode: none
gir_top1_confidence_floor: 0.25
gir_old_residual_enabled: true
gir_old_delete_enabled: false
gir_old_delete_warmup_steps: 1000
gir_old_delete_target_ratio: 0.01
gir_old_delete_budget_weight: 0.01
gir_old_delete_threshold: 0.5
gir_old_delete_temperature: 1.0
gir_old_delete_min_observations: 2
gir_old_delete_test_prune_enabled: true
gir_old_decay_enabled: false
gir_old_decay_topk: 4
gir_old_decay_strength: 0.02
gir_old_decay_prune_threshold: 0.005
gir_residual_topk: 4
gir_residual_independent_heads: true
# Match the selected overfit residual parameterization.
gir_mean_update_mode: absolute
gir_raw_scale_residual: true
gir_raw_opacity_residual: true
gir_raw_rotation_residual: false
gir_raw_harmonics_residual: false
gir_mean_relative_scale: 0.02
gir_rotation_scale: 0.05
gir_harmonics_scale: 0.10
# Keep every valid current-view Gaussian when it is appended to the stream.
# New-GS suppression is disabled for the current ablation.
gir_add_gate_enabled: false
gir_add_gate_warmup_steps: 1000
gir_add_rate_loss_weight: 0.0
gir_base_loss_weight: 1.0
gir_current_loss_weight: 1.0
gir_replay_loss_weight: 0.5
gir_aux_loss_weight: 1.0
gir_debug_numerics: false
gir_debug_numerics_max_views: 2
gir_historical_detach_mode: means
gir_new_residual_enabled: false
gir_residual_alpha_threshold: 0.02
gir_residual_depth_relative_tolerance: 0.08
gir_residual_rgb_bad_threshold: 0.08
