defaults:
  - backbone: croco

name: anysplat
mode: ${mode}

# Reconstruction features/cameras: zipmap or streamvggt, with shared GS heads.
reconstruction_backbone: zipmap
# native: use the selected backbone's pretrained DPT depth head.
# world_mirror: use the depth output inside the WorldMirror GS feature head.
depth_head_source: native
streamvggt_weights_path: weights/pre_svggt.safetensors
depth_teacher: ${oc.select:loss.depth.teacher,dav3}
# Experiments with direct pose/FOV supervision can detach rasterizer geometry
# from the camera head when camera gradients are unstable.
detach_predicted_camera_for_geometry: false
# Share the first input frame's predicted intrinsics across the sequence.
share_first_frame_intrinsics: false

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_monocular_samples: 32
num_surfaces: 1
predict_opacity: false

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 32

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

apply_bounds_shim: true

pretrained_weights: ""
scale_align: false

voxel_size: 0.001
n_offsets: 2
anchor_feat_dim: 83 # 32
add_view: false
color_attr: 3D # 3D or RGB
mlp_type: unified
scaffold: true
gir_top1_confidence_mode: none
gir_top1_confidence_floor: 0.25
gir_old_residual_enabled: true
gir_old_update_mode: pixel_topk
gir_projected_hidden_dim: 128
gir_projected_chunk_size: 65536
gir_projected_min_radius: 0.1
gir_projected_covariance_sigma: 3.0
gir_projected_opacity_logit_scale: 1.0
gir_projected_front_decay_strength: 0.02
gir_projected_warmup_steps: 1000
# RetroSplat-style d(RGB error)/d(opacity logit) evidence. Old and new GS use
# separate switches while sharing the evidence scaling and adapter weights.
gir_old_opacity_gradient_enabled: false
gir_new_opacity_gradient_enabled: false
gir_opacity_gradient_replay_views: 6
gir_opacity_gradient_scale: 1000.0
gir_opacity_gradient_clip: 20.0
gir_opacity_gradient_threshold: 1.0e-3
gir_opacity_gradient_current_weight: 1.0
gir_opacity_gradient_replay_weight: 0.5
# When enabled, deterministic front-conflict decay is allowed only where the
# combined current/replay RGB gradient asks opacity to decrease.
gir_opacity_gradient_front_decay_gate_enabled: false
gir_opacity_gradient_front_decay_threshold: 0.0
# Camera-space d(RGB loss)/d(mean residual) evidence for projected old GS.
gir_mean_gradient_enabled: false
gir_mean_gradient_scale: 1.0
gir_mean_gradient_clip: 20.0
gir_mean_gradient_threshold: 1.0e-6
gir_mean_gradient_replay_views: 6
gir_old_mean_gradient_current_weight: 1.0
gir_old_mean_gradient_replay_weight: 0.5
# Use the same camera-space evidence with an independent new-GS adapter.
gir_new_mean_gradient_enabled: false
gir_new_mean_gradient_replay_views: 0
gir_new_mean_gradient_current_weight: 1.0
gir_new_mean_gradient_replay_weight: 0.0
gir_old_delete_enabled: false
gir_old_delete_warmup_steps: 1000
gir_old_delete_target_ratio: 0.01
gir_old_delete_budget_weight: 0.01
gir_old_delete_threshold: 0.5
gir_old_delete_temperature: 1.0
gir_old_delete_min_observations: 2
gir_old_delete_test_prune_enabled: true
gir_old_decay_enabled: false
gir_old_decay_topk: 4
gir_old_decay_strength: 0.02
gir_old_decay_prune_threshold: 0.005
gir_residual_topk: 4
gir_residual_independent_heads: true
# Absolute means use raw camera-space output and ignore gir_mean_relative_scale;
# relative_depth uses tanh(output) * gir_mean_relative_scale * depth.
gir_mean_update_mode: absolute
gir_raw_scale_residual: true
gir_raw_opacity_residual: true
gir_raw_rotation_residual: false
gir_raw_harmonics_residual: false
gir_mean_relative_scale: 0.02
gir_rotation_scale: 0.05
gir_harmonics_scale: 0.10
# New-GS append policy. Hybrid point-map mode compares all projected point-map
# depth layers and deterministically fades conflicting front GS.
gir_append_mode: all  # all | point_map | learned
# Legacy fallback used only when hybrid mode is disabled.
gir_point_append_depth_check_enabled: true
gir_point_append_hybrid_enabled: false
# Whether a current surface clearly in front of all projected history may append.
gir_point_append_current_in_front_enabled: true
# Whether a current surface behind unmatched projected history may append.
gir_point_append_history_in_front_enabled: true
gir_point_append_depth_relative_tolerance: 0.15
gir_point_append_rgb_bad_threshold: 0.08
gir_point_append_old_alpha_threshold: 0.10
# Set above zero only after checking the backbone confidence distribution.
gir_point_append_min_depth_confidence: 0.0
gir_point_append_front_conflict_confirm_views: 1
gir_point_append_front_conflict_opacity_decay: 0.30
gir_point_append_max_ratio: 1.0
gir_point_append_dilation_radius: 2
gir_point_append_chunk_size: 65536
gir_add_gate_enabled: false
gir_add_gate_warmup_steps: 1000
gir_add_rate_loss_weight: 0.0
gir_base_loss_weight: 1.0
gir_current_loss_weight: 1.0
gir_new_hole_loss_weight: 1.0
gir_replay_loss_weight: 0.5
gir_aux_loss_weight: 1.0
gir_debug_numerics: false
gir_debug_numerics_max_views: 2
gir_historical_detach_mode: means
gir_new_residual_enabled: false
gir_residual_alpha_threshold: 0.02
gir_residual_depth_relative_tolerance: 0.08
gir_residual_rgb_bad_threshold: 0.08
