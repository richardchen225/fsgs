defaults:
  - base_dataset
  - view_sampler: bounded

name: dl3dv
test_scan_scenes: false
test_expected_scenes: null
# Optional GT depth for DAV3-vs-GT diagnostics. Set this to a directory
# relative to each scene directory, for example "depth".
gt_depth_dir: null
gt_depth_extension: auto
gt_depth_scale: 1.0
# Previous OpenBayes path:
# roots: [/openbayes/input/input0/dl3dv, /openbayes/input/input0/dl3dv/train_index.json]
roots: [datasets/dl3dv]

input_image_shape: [256, 256]
original_image_shape: [270, 480]
cameras_are_circular: false

baseline_min: 1e-3
baseline_max: 1e2
max_fov: 100.0
avg_pose: false

rescale_to_1cube: true
make_baseline_1: false
intr_augment: true
