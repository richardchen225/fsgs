# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv
  - override /model/encoder: anysplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse]

mode: train

model:
  encoder:
    mode: train
    reconstruction_backbone: streamvggt
    depth_head_source: native  # native | world_mirror
    streamvggt_weights_path: weights/pre_svggt.safetensors
    zipmap_weights_path: null
    share_first_frame_intrinsics: true
    gir_enabled: true
    depth_refine_enabled: false
    gir_render_scale: 1.0
    gir_raster_evidence_enabled: true
    gir_dominant_id_enabled: true
    gir_dominant_min_weight: 1.0e-4
    gir_old_residual_enabled: true
    gir_old_update_mode: projected_shared
    gir_projected_hidden_dim: 128
    gir_projected_chunk_size: 65536
    gir_projected_min_radius: 0.1
    gir_projected_covariance_sigma: 3.0
    gir_projected_opacity_logit_scale: 1.0
    # Hybrid append applies the deterministic decay instead.
    gir_projected_front_decay_strength: 0.0
    gir_projected_warmup_steps: 1000
    # Keep opacity-gradient conditioning and decay gating for historical GS,
    # while ablating the same input for newly appended GS.
    gir_old_opacity_gradient_enabled: true
    gir_new_opacity_gradient_enabled: false
    gir_opacity_gradient_replay_views: 6
    gir_opacity_gradient_scale: 1000.0
    gir_opacity_gradient_clip: 20.0
    gir_opacity_gradient_threshold: 1.0e-3
    # Match loss_updated_current=1.0 and loss_replay_history=0.5 below.
    gir_opacity_gradient_current_weight: 1.0
    gir_opacity_gradient_replay_weight: 0.5
    gir_opacity_gradient_front_decay_gate_enabled: true
    gir_opacity_gradient_front_decay_threshold: 0.0
    gir_mean_gradient_enabled: true
    gir_mean_gradient_scale: 1.0
    gir_mean_gradient_clip: 20.0
    gir_mean_gradient_threshold: 1.0e-6
    # Old GS adapts to the current observation while retaining replay context.
    gir_mean_gradient_replay_views: -1
    gir_old_mean_gradient_current_weight: 1.0
    gir_old_mean_gradient_replay_weight: 0.5
    gir_new_mean_gradient_enabled: true
    # New anchors are introduced by the current observation. Condition only
    # their mean residual on the current-view RGB gradient.
    gir_new_mean_gradient_replay_views: 0
    gir_new_mean_gradient_current_weight: 1.0
    gir_new_mean_gradient_replay_weight: 0.0
    gir_old_delete_enabled: false
    gir_old_decay_enabled: false
    gir_old_decay_topk: 4
    gir_old_decay_strength: 0.02
    gir_old_decay_prune_threshold: 0.005
    gir_add_gate_enabled: false
    gir_new_residual_enabled: true

toy:
  # replica: RGB+EXR depth toy scene; dl3dv: RGB-only transforms.json scene.
  dataset_type: replica
  data_root: ${oc.env:REPLICA_TOY_ROOT,.}
  transforms_path: null
  image_dir: images_8
  # DL3DV resize shape [height, width]. Both dimensions must be divisible by 14.
  resize_shape: [252, 518]
  # WorldMirror initializes GS heads only; native backbone/camera/depth stay intact.
  # An overfit checkpoint restores its trained heads and optimizer instead.
  checkpoint: weights/pre_wm.safetensors
  dav3_weights_path: weights/pre_dav3.safetensors
  train_frames: [28, 29]
  # Each accepts one or more IDs. Loss frames receive gradients; test frames
  # never do. The two groups should differ when measuring generalization.
  heldout_loss_frame: [27]
  heldout_test_frame: [27]
  heldout_loss_enabled: true
  max_replay_views: -1
  max_steps: 3000
  eval_every: 100
  save_every: 500
  save_checkpoints: false
  mixed_precision: true
  residual_enabled: true
  # Refine append-selected anchors with the same parameterization as old GS.
  new_residual_enabled: ${model.encoder.gir_new_residual_enabled}
  # Keep head construction and the overfit rollout on the same implementation.
  residual_mode: ${model.encoder.gir_old_update_mode}  # pixel_topk | projected_shared
  projected_hidden_dim: 128
  projected_chunk_size: 65536
  projected_min_radius: 0.1
  projected_covariance_sigma: 3.0
  projected_opacity_logit_scale: 1.0
  projected_front_decay_strength: 0.0
  projected_warmup_steps: 1000
  old_opacity_gradient_enabled: ${model.encoder.gir_old_opacity_gradient_enabled}
  new_opacity_gradient_enabled: ${model.encoder.gir_new_opacity_gradient_enabled}
  opacity_gradient_replay_views: ${model.encoder.gir_opacity_gradient_replay_views}
  opacity_gradient_scale: ${model.encoder.gir_opacity_gradient_scale}
  opacity_gradient_clip: ${model.encoder.gir_opacity_gradient_clip}
  opacity_gradient_threshold: ${model.encoder.gir_opacity_gradient_threshold}
  opacity_gradient_current_weight: ${model.encoder.gir_opacity_gradient_current_weight}
  opacity_gradient_replay_weight: ${model.encoder.gir_opacity_gradient_replay_weight}
  opacity_gradient_front_decay_gate_enabled: ${model.encoder.gir_opacity_gradient_front_decay_gate_enabled}
  opacity_gradient_front_decay_threshold: ${model.encoder.gir_opacity_gradient_front_decay_threshold}
  mean_gradient_enabled: ${model.encoder.gir_mean_gradient_enabled}
  mean_gradient_scale: ${model.encoder.gir_mean_gradient_scale}
  mean_gradient_clip: ${model.encoder.gir_mean_gradient_clip}
  mean_gradient_threshold: ${model.encoder.gir_mean_gradient_threshold}
  mean_gradient_replay_views: ${model.encoder.gir_mean_gradient_replay_views}
  old_mean_gradient_current_weight: ${model.encoder.gir_old_mean_gradient_current_weight}
  old_mean_gradient_replay_weight: ${model.encoder.gir_old_mean_gradient_replay_weight}
  new_mean_gradient_enabled: ${model.encoder.gir_new_mean_gradient_enabled}
  new_mean_gradient_replay_views: ${model.encoder.gir_new_mean_gradient_replay_views}
  new_mean_gradient_current_weight: ${model.encoder.gir_new_mean_gradient_current_weight}
  new_mean_gradient_replay_weight: ${model.encoder.gir_new_mean_gradient_replay_weight}
  # Scatter each pixel residual to its strongest K historical contributors.
  # K=1 preserves the original dominant-GS update path.
  residual_topk: 4
  # Match the main pipeline: rank-specific residual heads and top-k write-back.
  residual_contributor_conditioned: false
  residual_independent_heads: true
  # projected_shared updates every channel for surface-consistent RGB errors.
  residual_mean_enabled: true
  residual_rotation_enabled: true
  residual_scale_enabled: true
  residual_opacity_enabled: true
  residual_harmonics_enabled: true
  raw_scale_residual: true
  raw_opacity_residual: true
  raw_rotation_residual: false
  raw_harmonics_residual: false
  # These switches control optimization. The source switches below independently
  # choose which geometry is used to build and update the streaming GS map.
  train_gaussian_param_head: true
  train_gs_head: true
  train_camera_head: true
  # Fine-tune the selected ZipMap/StreamVGGT native DPT depth head.
  train_depth_head: true
  depth_loss_enabled: true
  # gt: absolute metric Z-depth L1; dav3: structure + weak absolute log-scale.
  depth_loss_target: dav3  # gt | dav3
  dav3_align_to_gt_camera_scale: true
  depth_absolute_log_scale_weight: 0.1
  # Report DAV3 directly against Replica GT even when DAV3 is not the training target.
  dav3_gt_metrics_enabled: true
  camera_source: predicted  # gt | predicted
  # Match the main test path: append held-out RGB frames only for camera-head
  # pose/FOV prediction, while excluding them from depth/GS map construction.
  target_camera_source: predicted  # predicted | gt
  depth_source: predicted   # gt | predicted
  detach_predicted_camera: false
  detach_predicted_depth: false
  # all: detach every historical GS parameter; means: detach positions only;
  # none: preserve the complete cross-view graph. Current residual updates are
  # applied after this boundary and remain differentiable for the current step.
  historical_detach_mode: none  # all | means | none
  # Immediate layered fusion mirrors the main training path.
  append_new_gs_enabled: true
  append_mode: point_map  # point_map | all
  point_append_depth_check_enabled: false
  point_append_hybrid_enabled: true
  # Ablation: do not treat a closer current surface as automatic new geometry.
  point_append_current_in_front_enabled: true
  # Ablation: do not append behind unmatched projected historical points.
  point_append_history_in_front_enabled: true
  point_append_depth_relative_tolerance: 0.15
  point_append_rgb_bad_threshold: 0.08
  point_append_old_alpha_threshold: 0.10
  point_append_min_depth_confidence: 0.0
  point_append_front_conflict_confirm_views: 1
  point_append_front_conflict_opacity_decay: 0.70
  point_append_max_ratio: 1.0
  point_append_dilation_radius: 2
  point_append_chunk_size: 65536

  # Contributor-conditioned top-4 soft opacity decay. Hard pruning is only
  # applied during evaluation when explicitly enabled.
  opacity_decay_enabled: false
  opacity_decay_topk: 4
  opacity_decay_strength: 0.02
  opacity_decay_temperature: 1.0
  opacity_decay_min_observations: 2
  opacity_decay_target_ratio: 0.01
  opacity_decay_budget_weight: 0.01
  opacity_decay_warmup_steps: 1000
  opacity_decay_test_prune_enabled: false
  opacity_decay_prune_threshold: 0.005

  gaussian_head_lr: 1.0e-5
  depth_head_lr: 1.0e-5
  gs_head_lr: 5.0e-5
  residual_head_lr: 5.0e-5
  camera_head_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0

  # The EXR must contain optical-axis Z depth. Use "ray" when it stores
  # Euclidean camera-to-surface distance instead.
  depth_type: z
  alpha_threshold: 0.02
  depth_relative_tolerance: 0.08
  rgb_bad_threshold: 0.08
  dominant_min_weight: 1.0e-4

  loss_base_first: 1.0
  loss_updated_current: 1.0
  loss_new_holes: 1.0
  loss_replay_history: 0.5
  # Weight for either absolute GT depth or DAV3 structure + absolute log-scale.
  loss_depth: 1.0e-2
  loss_camera: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 1.0
  camera_focal_weight: 1.0
  loss_heldout: 1.0
  loss_residual_regularization: 1.0e-4

  # absolute uses the raw camera-space output and ignores mean_relative_scale;
  # relative_depth uses tanh(output) * mean_relative_scale * depth.
  mean_update_mode: absolute  # absolute | relative_depth
  # Bounds used by the relative-depth mean mode and channels in bounded mode.
  mean_relative_scale: 0.02
  rotation_scale: 0.05
  harmonics_scale: 0.10

hydra:
  run:
    dir: outputs/replica_old_gs_overfit/${now:%Y-%m-%d_%H-%M-%S}
