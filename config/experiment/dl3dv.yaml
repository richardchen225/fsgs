# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv
  - override /model/encoder: anysplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips, ssim, depth]

wandb:
  name: dl3dv
  tags: [dl3dv, 448x448]
  
model:
  encoder:
    mode: ${mode}
    reconstruction_backbone: zipmap
    zipmap_weights_path: weights/pre_zipmap.pt
    # Keep photometric gradients to the camera head. The decoder uses rigid
    # pose inversion and the configured 0.01 near plane for stable backprop.
    detach_predicted_camera_for_geometry: false
    depth_refine_downsample_factor: 4
    depth_refine_enabled: false
    gir_enabled: true
    # Match the successful overfit setup: build GIR evidence and auxiliary
    # renders at full resolution.
    gir_render_scale: 1.0
    gir_raster_evidence_enabled: true
    gir_dominant_id_enabled: true
    gir_dominant_min_weight: 1e-4
    gir_top1_confidence_mode: none
    gir_top1_confidence_floor: 0.25
    gir_old_residual_enabled: true
    # GS-centric old-map update: project every old GS and decode its opacity
    # update with one shared pointwise MLP. No top-k contributor IDs are used.
    gir_old_update_mode: projected_shared
    gir_projected_hidden_dim: 128
    gir_projected_chunk_size: 65536
    gir_projected_min_radius: 0.1
    gir_projected_covariance_sigma: 3.0
    gir_projected_opacity_logit_scale: 1.0
    # Disable the learned projected-front decay; point-map decay is configured below.
    gir_projected_front_decay_strength: 0.0
    gir_projected_warmup_steps: 1000
    # Condition both old/new residual branches on rendered opacity gradients.
    # The old-GS evidence also gates deterministic front-conflict decay.
    gir_old_opacity_gradient_enabled: true
    gir_new_opacity_gradient_enabled: true
    gir_opacity_gradient_front_decay_gate_enabled: true
    # Keep mean-gradient conditioning disabled in this experiment.
    gir_mean_gradient_enabled: false
    gir_new_mean_gradient_enabled: false
    gir_old_delete_enabled: false
    gir_old_delete_warmup_steps: 1000
    gir_old_delete_target_ratio: 0.01
    gir_old_delete_budget_weight: 0.01
    gir_old_delete_threshold: 0.5
    gir_old_delete_temperature: 1.0
    gir_old_delete_min_observations: 2
    gir_old_delete_test_prune_enabled: true
    # Projected shared updates include their own front-surface opacity decay.
    gir_old_decay_enabled: false
    gir_old_decay_topk: 4
    gir_old_decay_strength: 0.02
    gir_old_decay_prune_threshold: 0.005
    gir_residual_topk: 4
    gir_residual_independent_heads: true
    # absolute: raw camera-space displacement; relative_depth:
    # tanh(output) * gir_mean_relative_scale * contributor depth.
    gir_mean_update_mode: absolute
    gir_raw_scale_residual: true
    gir_raw_opacity_residual: true
    gir_raw_rotation_residual: false
    gir_raw_harmonics_residual: false
    gir_mean_relative_scale: 0.02
    gir_rotation_scale: 0.05
    gir_harmonics_scale: 0.10
    gir_hidden_dim: 64
    # -1 keeps the complete sequence graph and replays every earlier view,
    # matching the successful overfit rollout.
    gir_tbptt_chunk: -1
    gir_replay_views: -1
    gir_aux_loss_weight: 1.0
    gir_base_loss_weight: 1.0
    gir_current_loss_weight: 1.0
    gir_new_hole_loss_weight: 1.0
    gir_replay_loss_weight: 0.5
    gir_history_adapt_weight: 0.0
    gir_history_preserve_weight: 0.0
    gir_history_loss_interval: 4
    gir_history_preserve_margin: 0.002
    gir_history_replay_views: -1
    # Immediate layered fusion: decay old points in front, keep matching and
    # behind layers, and append every reliable current surface without a match.
    gir_append_mode: point_map
    gir_point_append_depth_check_enabled: false
    gir_point_append_hybrid_enabled: true
    # Ablation: do not treat a closer current surface as automatic new geometry.
    gir_point_append_current_in_front_enabled: true
    # Ablation: do not append behind unmatched projected historical points.
    gir_point_append_history_in_front_enabled: true
    gir_point_append_depth_relative_tolerance: 0.15
    gir_point_append_rgb_bad_threshold: 0.08
    gir_point_append_old_alpha_threshold: 0.10
    gir_point_append_min_depth_confidence: 0.0
    gir_point_append_front_conflict_confirm_views: 1
    # Decay fraction 0.70 retains 30% opacity for a selected old GS.
    gir_point_append_front_conflict_opacity_decay: 0.70
    gir_point_append_max_ratio: 1.0
    gir_point_append_dilation_radius: 2
    gir_point_append_chunk_size: 65536
    gir_add_gate_enabled: false
    gir_new_residual_enabled: true
    # Preserve cross-view gradients inside each TBPTT chunk so sparse point-map
    # appends can jointly optimize the shared historical geometry.
    gir_historical_detach_mode: none
    gir_residual_alpha_threshold: 0.02
    gir_residual_depth_relative_tolerance: 0.08
    gir_residual_rgb_bad_threshold: 0.08
    gir_add_gate_warmup_steps: 1000
    gir_add_rate_loss_weight: 0.0
    gir_regularization_weight: 1e-4
    
dataset:
  dl3dv:
    mode: ${mode}
    # Previous OpenBayes roots:
    # roots: [/openbayes/input/input0/dl3dv]
    roots: [datasets/dl3dv]
    ctx_list: [1, 5, 10, 15, 20, 2, 3, 7, 12, 17, 18]
    tgt_list: [2, 3, 7, 12, 17, 18]
    input_image_shape: [252, 518]
    view_sampler:
      num_target_views: 9
      min_distance_between_context_views: 32
      max_distance_between_context_views: 48
      min_gap_multiplier: 3
      max_gap_multiplier: 5
    avg_pose: false
    intr_augment: true
    normalize_by_pts3d: false
    rescale_to_1cube: false

optimizer:
  lr: 5e-5
  # Fine-tune the pretrained reconstruction and camera heads while training GIR.
  pretrained_lr: 1e-5
  scratch_lr: 5e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  train_base_heads: true
  train_gir: true

data_loader:
  train:
    batch_size: 2
  val:
    batch_size: 1
    
trainer:
  max_steps: 20000
  val_check_interval: 100
  num_nodes: 1
  devices: 4
  accumulate_grad_batches: 1
  precision: 16-mixed

checkpointing:
  load: null
  # Initialize compatible heads from WorldMirror; start a new optimizer/schedule.
  train_pretrained_weights: weights/pre_wm.safetensors
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 10
  
train:
  pose_loss_alpha: 1.0
  pose_loss_delta: 1.0
  camera_focal_weight: 1.0
  cxt_depth_weight: 1.0
  weight_pose: 10.0
  weight_depth: 1.0
  weight_normal: 0.1

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
    
loss:
  mse:
    weight_ctx: 0.0
    weight_novel: 1.0
    conf: false
  lpips:
    weight: 0.05
    apply_after_step: 0
  ssim:
    weight: 0.05
    apply_after_step: 0
  depth:
    teacher: dav3
    alignment: sequence_scale_only_log
    # DAV3 is run independently per scene and aligned to that scene's GT
    # camera trajectory scale before supervising predicted depth.
    align_to_gt_camera_scale: true
    absolute_log_scale_weight: 0.1
    weight: 1.0
    sigma_image: null
    use_second_derivative: false
    dav3_weights_path: weights/pre_dav3.safetensors
 
