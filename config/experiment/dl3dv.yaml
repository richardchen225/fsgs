# @package _global_

defaults:
  - /dataset@_group_.dl3dv: dl3dv
  - override /model/encoder: anysplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips, depth]
  - _self_

wandb:
  name: dl3dv
  tags: [dl3dv, 448x448]
  
model:
  encoder:
    mode: ${mode}
    reconstruction_backbone: streamvggt
    depth_head_source: native  # native | world_mirror
    streamvggt_weights_path: weights/pre_svggt.safetensors
    zipmap_weights_path: weights/pre_zipmap.pt
    # Match offline detach_predicted_camera=true: RGB geometry cannot update
    # the camera head; only the explicit adjacent-pair camera loss can do so.
    detach_predicted_camera_for_geometry: true
    # Use the first source frame's predicted intrinsics for every view.
    share_first_frame_intrinsics: false
    # Match offline_gs_mlp_overfit: predicted geometry is aligned once to the
    # source GT gauge, while source/heldout RGB supervision renders with GT.
    sim3_alignment_mode: always
    source_render_camera: gt
    heldout_test_camera: gt
    depth_refine_downsample_factor: 4
    depth_refine_enabled: false
    gir_enabled: true
    # Match the successful overfit setup: build GIR evidence and auxiliary
    # renders at full resolution.
    gir_render_scale: 1.0
    gir_raster_evidence_enabled: true
    gir_dominant_id_enabled: true
    gir_dominant_min_weight: 1e-4
    gir_top1_confidence_mode: none
    gir_top1_confidence_floor: 0.25
    # The unified learned optimizer runs after point-map append and replaces
    # the separate old/new residual and deterministic functional-update paths.
    gir_old_residual_enabled: false
    # GS-centric old-map update: project every old GS and decode its opacity
    # update with one shared pointwise MLP. No top-k contributor IDs are used.
    gir_old_update_mode: projected_shared
    gir_projected_hidden_dim: 128
    gir_projected_chunk_size: 65536
    gir_projected_min_radius: 0.1
    gir_projected_covariance_sigma: 3.0
    gir_projected_opacity_logit_scale: 1.0
    # Disable the learned projected-front decay; point-map decay is configured below.
    gir_projected_front_decay_strength: 0.0
    gir_projected_warmup_steps: 1000
    # Condition both old/new residual branches on rendered opacity gradients.
    # The old-GS evidence also gates deterministic front-conflict decay.
    gir_old_opacity_gradient_enabled: false
    gir_new_opacity_gradient_enabled: false
    gir_opacity_gradient_front_decay_gate_enabled: false
    # Match overfit old-GS camera-space mean-gradient conditioning. Use the
    # current frame plus every causally available replay frame.
    gir_mean_gradient_enabled: false
    gir_mean_gradient_scale: 1.0
    gir_mean_gradient_clip: 20.0
    gir_mean_gradient_threshold: 1.0e-6
    gir_mean_gradient_replay_views: -1
    gir_old_mean_gradient_current_weight: 1.0
    gir_old_mean_gradient_replay_weight: 0.5
    # Split a small top-ranked subset of large, high-gradient, geometrically
    # consistent historical splats into two independently revisable children.
    gir_split_enabled: false
    gir_split_projected_radius_threshold: 4.0
    gir_split_mean_gradient_threshold: 1.0e-6
    gir_split_min_observations: 2
    gir_split_max_ratio: 0.005
    gir_split_max_generation: 1
    gir_split_offset_scale: 0.4
    gir_split_scale_divisor: 1.6
    gir_split_min_opacity: 0.02
    gir_split_max_gaussians: 0
    gir_split_warmup_steps: 1000
    gir_functional_update_enabled: false
    gir_functional_update_replay_views: 2
    gir_functional_update_top_ratio: 0.05
    gir_functional_update_min_observations: 1
    gir_functional_update_mean_enabled: true
    gir_functional_update_opacity_enabled: true
    gir_functional_update_harmonics_enabled: true
    gir_functional_update_mean_learning_rate: 1.0e-3
    gir_functional_update_opacity_learning_rate: 5.0e-3
    gir_functional_update_harmonics_learning_rate: 1.0e-3
    gir_functional_update_harmonics_gradient_scale: 1.0
    gir_functional_update_harmonics_gradient_clip: 20.0
    gir_functional_update_harmonics_gradient_threshold: 1.0e-6
    gir_functional_update_current_weight: 1.0
    gir_functional_update_replay_weight: 0.5
    gir_functional_update_max_mean_step_scale: 0.25
    gir_functional_update_max_opacity_logit_step: 0.10
    gir_functional_update_max_harmonics_step: 0.05
    gir_symmetric_multiview_update_enabled: true
    gir_symmetric_multiview_hidden_dim: 128
    gir_symmetric_multiview_chunk_size: 16384
    # DeltaSplat-style image-space context, aggregated symmetrically over views.
    gir_symmetric_multiview_visual_enabled: false
    gir_symmetric_multiview_visual_feature_dim: 24
    gir_symmetric_multiview_visual_hidden_dim: 32
    gir_symmetric_multiview_visual_image_scale: 0.5
    gir_symmetric_multiview_visual_depth_temperature: 0.10
    gir_symmetric_multiview_visual_min_alpha: 0.01
    gir_symmetric_multiview_opacity_gradient_scale: 1000.0
    gir_symmetric_multiview_opacity_gradient_clip: 20.0
    gir_symmetric_multiview_opacity_gradient_threshold: 1.0e-3
    gir_symmetric_multiview_mean_gradient_scale: 1.0
    gir_symmetric_multiview_mean_gradient_clip: 20.0
    gir_symmetric_multiview_mean_gradient_threshold: 1.0e-6
    gir_symmetric_multiview_harmonics_gradient_scale: 1.0
    gir_symmetric_multiview_harmonics_gradient_clip: 20.0
    gir_symmetric_multiview_harmonics_gradient_threshold: 1.0e-6
    gir_symmetric_multiview_max_mean_step_scale: 0.10
    gir_symmetric_multiview_max_rotation_step: 0.01
    gir_symmetric_multiview_max_log_scale_step: 0.02
    gir_symmetric_multiview_max_opacity_logit_step: 0.10
    gir_symmetric_multiview_max_harmonics_step: 0.05
    gir_symmetric_multiview_unbounded_updates: true
    gir_training_mode: incremental_final_map
    # Point-map anchors progressively add persistent, non-recursive children.
    gir_anchor_child_enabled: false
    gir_anchor_child_max_count: 8
    gir_anchor_child_add_count: 1
    gir_anchor_child_min_observations: 2
    gir_anchor_child_gradient_threshold: 0.05
    gir_anchor_child_coherence_threshold: 0.5
    gir_anchor_child_max_conflict_ratio: 0.25
    gir_anchor_child_cooldown_views: 2
    gir_anchor_child_max_ratio: 0.05
    gir_anchor_child_offset_scale: 0.4
    gir_anchor_child_scale_divisor: 1.6
    gir_anchor_child_min_opacity: 0.02
    gir_anchor_child_max_gaussians: 500000
    # This experiment conditions only historical GS updates on mean gradients.
    gir_new_mean_gradient_enabled: false
    gir_old_delete_enabled: false
    gir_old_delete_warmup_steps: 1000
    gir_old_delete_target_ratio: 0.01
    gir_old_delete_budget_weight: 0.01
    gir_old_delete_threshold: 0.5
    gir_old_delete_temperature: 1.0
    gir_old_delete_min_observations: 2
    gir_old_delete_test_prune_enabled: true
    # Projected shared updates include their own front-surface opacity decay.
    gir_old_decay_enabled: false
    gir_old_decay_topk: 4
    gir_old_decay_strength: 0.02
    gir_old_decay_prune_threshold: 0.005
    gir_residual_topk: 4
    gir_residual_independent_heads: true
    # absolute: raw camera-space displacement; relative_depth:
    # tanh(output) * gir_mean_relative_scale * contributor depth.
    gir_mean_update_mode: absolute
    gir_raw_scale_residual: true
    gir_raw_opacity_residual: true
    gir_raw_rotation_residual: false
    gir_raw_harmonics_residual: false
    gir_mean_relative_scale: 0.02
    gir_rotation_scale: 0.05
    gir_harmonics_scale: 0.10
    gir_hidden_dim: 64
    # -1 keeps the complete sequence graph and replays every earlier view,
    # matching the successful overfit rollout.
    gir_tbptt_chunk: -1
    gir_replay_views: -1
    # Final-map mode still renders causal evidence per arrival, but these
    # intermediate RGB terms are excluded from the training objective.
    gir_aux_loss_weight: 0.0
    gir_base_loss_weight: 1.0
    gir_current_loss_weight: 1.0
    gir_new_hole_loss_weight: 1.0
    gir_replay_loss_weight: 0.5
    gir_history_adapt_weight: 0.0
    gir_history_preserve_weight: 0.0
    gir_history_loss_interval: 4
    gir_history_preserve_margin: 0.002
    gir_history_replay_views: -1
    # Point-map coverage decides which later-view pixels receive new anchors.
    gir_append_mode: point_map
    gir_tracker_backend: alltracker
    gir_tracker_repo_path: third_party/AllTracker
    gir_tracker_weights_path: third_party/AllTracker/ckpts/alltracker.pth
    # Match the official AllTracker demo inference path (FP32).
    gir_tracker_mixed_precision: false
    gir_tracker_iterations: 4
    gir_tracker_window_length: 16
    # Coverage is intentionally more permissive than AllTracker's official
    # tracking evaluation threshold (0.6): uncertain correspondences should
    # suppress duplicate GS unless they also fail the relaxed FB cycle check.
    gir_tracker_visibility_threshold: 0.3
    gir_tracker_coverage_threshold: 0.05
    gir_tracker_dilation_radius: 2
    gir_tracker_forward_backward_enabled: true
    gir_tracker_cycle_absolute_threshold: 3.0
    gir_tracker_cycle_relative_threshold: 0.10
    gir_point_append_depth_check_enabled: false
    gir_point_append_align_depth_scale_enabled: false
    gir_point_map_follow_mean_updates_enabled: true
    gir_point_append_hybrid_enabled: true
    # Ablation: do not treat a closer current surface as automatic new geometry.
    gir_point_append_current_in_front_enabled: true
    # Ablation: do not append behind unmatched projected historical points.
    gir_point_append_history_in_front_enabled: true
    gir_point_append_depth_relative_tolerance: 0.10
    gir_point_append_rgb_bad_threshold: 0.08
    gir_point_append_old_alpha_threshold: 0.10
    gir_point_append_min_depth_confidence: 0.0
    gir_point_append_front_conflict_confirm_views: 1
    # Decay fraction 0.70 retains 30% opacity for a selected old GS.
    gir_point_append_front_conflict_opacity_decay: 0.70
    gir_point_append_max_ratio: 1.0
    gir_point_append_dilation_radius: 0
    gir_point_append_chunk_size: 65536
    gir_add_gate_enabled: false
    gir_new_residual_enabled: false
    # Use the original dense gs_head for candidate initialization.
    gir_new_gs_shared_decoder_enabled: false
    # Preserve cross-view gradients inside each TBPTT chunk so sparse point-map
    # appends can jointly optimize the shared historical geometry.
    gir_historical_detach_mode: none
    gir_residual_alpha_threshold: 0.02
    gir_residual_depth_relative_tolerance: 0.08
    gir_residual_rgb_bad_threshold: 0.08
    gir_add_gate_warmup_steps: 1000
    gir_add_rate_loss_weight: 0.0
    gir_regularization_weight: 0.0
    
dataset:
  dl3dv:
    mode: ${mode}
    # Previous OpenBayes roots:
    # roots: [/openbayes/input/input0/dl3dv]
    roots: [datasets/dl3dv]
    ctx_list: [1, 5, 10, 15, 20, 2, 3, 7, 12, 17, 18]
    tgt_list: [2, 3, 7, 12, 17, 18]
    input_image_shape: [252, 518]
    view_sampler:
      # Training splits the sampled sequence in half. Six total views guarantee
      # the three source cameras required by Sim(3) alignment.
      min_context_views: 6
      num_target_views: 9
      min_distance_between_context_views: 32
      max_distance_between_context_views: 48
      min_gap_multiplier: 3
      max_gap_multiplier: 5
    avg_pose: false
    intr_augment: true
    normalize_by_pts3d: false
    rescale_to_1cube: false

optimizer:
  lr: 5e-5
  # Match the independently optimized offline heads.
  pretrained_lr: 1e-5
  scratch_lr: 5e-5
  gaussian_param_head_lr: 1e-5
  gs_head_lr: 5e-5
  camera_lr: 1e-5
  depth_lr: 1e-5
  gir_lr: 1e-4
  base_weight_decay: 0.0
  gir_weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  scheduler_mode: cosine
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  train_base_heads: true
  train_gir: true
  train_gaussian_param_head: true
  train_gs_head: true
  train_camera_head: true
  train_depth_head: true

data_loader:
  train:
    batch_size: 2
  val:
    batch_size: 1
    
trainer:
  max_steps: 20000
  val_check_interval: 100
  num_nodes: 1
  devices: 4
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: 16-mixed

checkpointing:
  load: null
  # Initialize compatible heads from WorldMirror; start a new optimizer/schedule.
  train_pretrained_weights: weights/pre_wm.safetensors
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 10

test:
  save_unfiltered_ply: true
  
train:
  pose_loss_alpha: 1.0
  pose_loss_delta: 1.0
  camera_focal_weight: 1.0
  camera_pose_loss_mode: adjacent_pair
  camera_translation_direction_weight: 0.1
  # Match offline: ignore nearly static pairs in the direction term and
  # emphasize pairs in proportion to their GT adjacent baseline.
  camera_translation_direction_min_baseline_ratio: 0.05
  camera_translation_direction_baseline_weighting: true
  camera_global_trajectory_weight: 0.1
  camera_grad_clip: 1.0
  cxt_depth_weight: 1.0
  weight_pose: 1.0
  weight_depth: 1.0
  weight_normal: 0.1

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}
    
loss:
  mse:
    # Final source-map reconstruction plus the existing heldout half.
    weight_ctx: 1.0
    weight_novel: 1.0
    conf: false
  lpips:
    weight: 0.05
    apply_after_step: 0
    view_group: source
    chunk_size: 1
    gradient_checkpointing: true
  depth:
    teacher: dav3
    alignment: sequence_scale_only_log
    # DAV3 is run independently per scene and aligned to that scene's GT
    # camera trajectory scale before supervising predicted depth.
    align_to_gt_camera_scale: true
    absolute_log_scale_weight: 0.1
    weight: 1.0
    sigma_image: null
    use_second_derivative: false
    dav3_weights_path: weights/pre_dav3.safetensors
 
